name: zoom
description: "ZOOM - gestor financeiro pessoal para a galera jovem, 100% offline e personalizavel."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^17.2.4
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4
  flutter_colorpicker: ^1.1.0
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-400.ttf
          weight: 400
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700
